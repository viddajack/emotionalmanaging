<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Émotionnellement agile · Chiens et chats</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#17302b;--mute:#5b726c;--line:#d3e0dc;--accent:#1f7a6d;--on:#fff;--warn:#fff1d6;--warnink:#6b4a00}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b19;--card:#172725;--ink:#e6f1ee;--mute:#9bb5ae;--line:#2a3f3b;--accent:#4fc2b0;--on:#0f1b19;--warn:#3a2f17;--warnink:#f3d9a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 4px}
h2{font-size:1.1rem;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;min-height:44px}
button[aria-pressed="true"],.tab[aria-selected="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
button.go{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:9px 6px}
.mood{font-size:1.5rem;padding:8px 12px;flex:1}
label.ck{display:flex;gap:10px;align-items:center;padding:8px 0;min-height:44px}
label.ck input{width:20px;height:20px;accent-color:var(--accent)}
ul{padding-left:20px;margin:6px 0}
li{margin-bottom:6px}
.log{list-style:none;padding:0}
